                    - text: Transition
                - text: allows you to specify the type of transition to use when you want to add or remove effects within a container. For effects you want to add or remove that are positioned within the container’s assigned spacing, the default transition type is
                - link "matchedGeometry" [ref=e956] [cursor=pointer]:
